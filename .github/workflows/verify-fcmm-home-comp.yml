name: Verify FCMM Home composition

on:
  push:
    branches:
      - feat/fcmm-home-comp-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm ci
      - run: npm run build
      - run: git diff --check 7fcb80fe42346cb8fcf6361d0b8ec94d437183f4...HEAD
